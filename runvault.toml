# 指標が何を測っているか (runvault の宣言．rs-runvault docs/metrics.ja.md)．
#
# 名前は `simulation/src/record.rs` と `simulation/src/main.rs` が記録するものと一致していなければならない．
#
# `direction` は «値が大きいほど良いか»．模型の状態や到達量は成績ではないので
# `none` とし，再現精度やキャッシュ効率のように評価方向が定まる量だけ `up` /
# `down` とする．
#
# 条件名を `_` で指標名へ連結するため，有限な ABM 条件と公開 CLI が案内する 3 データセットを展開して明示する．

[metrics."macro_bias"]
meaning   = "全エージェントの態度の平均"
unit      = "score"
direction = "none"
range     = [-1.0, 1.0]
scope     = ["run"]

[metrics."macro_diversity"]
meaning   = "エージェントの態度分布の母分散"
unit      = "variance"
direction = "none"
range     = [0.0, 1.0]
scope     = ["run"]

[metrics."mobilized"]
meaning   = "態度の絶対値が動員しきい値以上のエージェント数"
unit      = "count"
direction = "none"
scope     = ["run"]

[metrics."polarization"]
meaning   = "正負の極端群の積で測る態度分布の二極化度"
unit      = "ratio"
direction = "none"
range     = [0.0, 1.0]
scope     = ["run"]

[metrics."core_influence"]
meaning   = "LLM コア層の平均態度"
unit      = "score"
direction = "none"
range     = [-1.0, 1.0]
scope     = ["run"]

[metrics."llm_actions"]
meaning   = "そのステップで LLM 呼び出しを行ったコアエージェント数"
unit      = "count"
direction = "none"
scope     = ["run"]

[metrics."converged"]
meaning   = "収束して終わったなら 1，打ち切りなら 0"
unit      = "boolean"
direction = "none"
range     = [0.0, 1.0]
scope     = ["run"]

[metrics."final_step"]
meaning   = "シミュレーションが停止したステップ数"
unit      = "count"
direction = "none"
scope     = ["run"]

[metrics."llm_calls"]
meaning   = "この run が行った LLM の呼び出し回数"
unit      = "count"
direction = "none"
scope     = ["run"]

[metrics."llm_cache_hits"]
meaning   = "そのうちキャッシュで済んだ回数"
unit      = "count"
direction = "none"
scope     = ["run"]

[metrics."llm_cache_hit_rate"]
meaning   = "LLM 呼び出しのうちキャッシュで済んだ割合"
unit      = "ratio"
direction = "up"
range     = [0.0, 1.0]
scope     = ["run"]

[metrics."n_converged"]
meaning   = "この条件の試行のうち収束した本数"
unit      = "count"
direction = "none"
scope     = ["run"]

[metrics."mean_final_macro_bias"]
meaning   = "試行群にわたる最終平均態度の平均"
unit      = "score"
direction = "none"
range     = [-1.0, 1.0]
scope     = ["run"]

[metrics."mean_final_macro_diversity"]
meaning   = "試行群にわたる最終態度分散の平均"
